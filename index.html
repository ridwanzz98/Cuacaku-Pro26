<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prakiraan Cuaca Lokal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .location {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .sub-location {
            font-size: 1em;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .temperature {
            font-size: 4em;
            font-weight: bold;
            margin: 10px 0;
            color: #e74c3c;
        }
        .description {
            font-size: 1.2em;
            text-transform: capitalize;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            font-size: 0.9em;
        }
        .detail-value {
            font-weight: bold;
            font-size: 1.2em;
            color: #2980b9;
        }
        #loading {
            font-size: 1.2em;
            color: #34495e;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <div id="loading">Meminta akses lokasi...<br><small>Pastikan GPS Anda aktif</small></div>
        
        <div id="weather-content" class="hidden">
            <div class="location" id="kecamatan-name">Kecamatan</div>
            <div class="sub-location" id="city-name">Kota/Kabupaten</div>
            <div class="temperature"><span id="temp-value">--</span>°C</div>
            <div class="description" id="weather-desc">Memuat cuaca...</div>
            
            <div class="details">
                <div class="detail-item">
                    <span>Angin</span>
                    <span class="detail-value"><span id="wind-speed">--</span> km/h</span>
                </div>
                <div class="detail-item">
                    <span>Arah Angin</span>
                    <span class="detail-value"><span id="wind-dir">--</span>°</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Menerjemahkan kode cuaca WMO ke bahasa Indonesia
        function getWeatherDescription(code) {
            const weatherCodes = {
                0: "Cerah",
                1: "Cerah Berawan",
                2: "Berawan",
                3: "Mendung",
                45: "Berkabut",
                48: "Kabut Tebal",
                51: "Gerimis Ringan",
                53: "Gerimis Sedang",
                55: "Gerimis Lebat",
                61: "Hujan Ringan",
                63: "Hujan Sedang",
                65: "Hujan Lebat",
                71: "Salju Ringan", // Hanya untuk antisipasi kode global
                80: "Hujan Deras Lokal",
                95: "Badai Petir",
                96: "Badai Petir & Hujan Es",
                99: "Badai Petir Hebat"
            };
            return weatherCodes[code] || "Tidak diketahui";
        }

        // Mengambil nama lokasi berdasarkan koordinat
        async function getLocationName(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=id`);
                const data = await response.json();
                
                const address = data.address;
                // Mengutamakan nama kecamatan, desa, atau distrik
                const kecamatan = address.village || address.suburb || address.city_district || address.town || "Lokasi Tidak Diketahui";
                const kota = address.city || address.county || address.state || "";
                
                document.getElementById('kecamatan-name').textContent = kecamatan;
                document.getElementById('city-name').textContent = kota;
            } catch (error) {
                console.error("Gagal mengambil nama lokasi", error);
                document.getElementById('kecamatan-name').textContent = "Koordinat Ditemukan";
                document.getElementById('city-name').textContent = "Gagal memuat nama daerah";
            }
        }

        // Mengambil data cuaca berdasarkan koordinat
        async function getWeatherData(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                const current = data.current_weather;

                document.getElementById('temp-value').textContent = Math.round(current.temperature);
                document.getElementById('wind-speed').textContent = current.windspeed;
                document.getElementById('wind-dir').textContent = current.winddirection;
                document.getElementById('weather-desc').textContent = getWeatherDescription(current.weathercode);

                // Sembunyikan loading, tampilkan cuaca
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('weather-content').classList.remove('hidden');

            } catch (error) {
                console.error("Gagal mengambil data cuaca", error);
                document.getElementById('loading').innerHTML = "Gagal memuat data cuaca. Silakan muat ulang halaman.";
            }
        }

        // Meminta akses lokasi perangkat
        function initGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        getLocationName(lat, lon);
                        getWeatherData(lat, lon);
                    },
                    (error) => {
                        let msg = "Gagal mendapatkan lokasi.";
                        if(error.code === 1) msg = "Akses lokasi ditolak oleh pengguna.";
                        document.getElementById('loading').innerHTML = msg + "<br><small>Izinkan akses lokasi di pengaturan browser Anda.</small>";
                    }
                );
            } else {
                document.getElementById('loading').textContent = "Browser Anda tidak mendukung Geolocation.";
            }
        }

        // Jalankan saat halaman dimuat
        window.onload = initGeolocation;
    </script>
</body>
</html>
