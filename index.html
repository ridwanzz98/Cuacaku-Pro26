<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca Premium ID Ultimate V2</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome (Hanya untuk ikon UI) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff; min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 20px;
        }
        .container { width: 100%; max-width: 600px; padding-bottom: 40px; }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Search Bar */
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input {
            flex: 1; padding: 12px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: #fff;
            font-family: 'Poppins', sans-serif; outline: none;
        }
        .search-input::placeholder { color: #b0bec5; }
        .search-btn, .gps-btn {
            background: rgba(255,255,255,0.2); border: none;
            color: #fff; padding: 12px 18px; border-radius: 20px;
            cursor: pointer; transition: 0.3s;
        }
        .search-btn:hover, .gps-btn:hover { background: rgba(255,255,255,0.4); }

        /* Header / Lokasi */
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { font-size: 1.8em; font-weight: 600; margin-bottom: 5px; }
        .header p { font-size: 0.9em; color: #b0bec5; }

        /* Suhu Saat Ini */
        .current-weather { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .animated-icon-main { width: 130px; height: 130px; margin-top: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .temp-main { font-size: 4.5em; font-weight: 700; line-height: 1; margin: 5px 0; text-shadow: 2px 4px 10px rgba(0,0,0,0.3); }
        .temp-desc-title { font-size: 1.3em; font-weight: 600; margin-bottom: 5px; text-transform: capitalize; }
        .temp-desc-text { font-size: 0.9em; color: #cfd8dc; max-width: 80%; margin-bottom: 15px; line-height: 1.4; }

        /* Grid Detail */
        .details-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .detail-item {
            display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.2); padding: 12px; border-radius: 16px;
        }
        .detail-icon { font-size: 1.5em; color: #90caf9; }
        .detail-info p { font-size: 0.75em; color: #b0bec5; margin-bottom: 2px; }
        .detail-info h4 { font-size: 1em; font-weight: 600; }

        /* Prakiraan Tab */
        .section-title { font-size: 1.1em; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 8px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
            color: #fff; font-family: 'Poppins'; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { background: rgba(255,255,255,0.4); font-weight: 600; border-color: #fff; }

        /* Prakiraan 3 Jam (Horizontal Scroll) */
        .hourly-scroll {
            display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.3) transparent;
        }
        .hourly-item { display: flex; flex-direction: column; align-items: center; min-width: 60px; gap: 5px; }
        .hourly-time { font-size: 0.85em; color: #b0bec5; }
        .hourly-icon { width: 45px; height: 45px; }
        .hourly-temp { font-weight: 600; font-size: 1em; }
        
        /* Bar Indikator (Suhu & Hujan) */
        .daily-list { display: flex; flex-direction: column; gap: 15px; }
        .daily-item {
            display: grid; grid-template-columns: 2fr 1fr 1fr 3fr 1fr; align-items: center; gap: 10px;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9em;
        }
        .daily-item:last-child { border-bottom: none; padding-bottom: 0; }
        .daily-day { font-weight: 600; }
        .daily-icon-img { width: 40px; height: 40px; margin: 0 auto; }
        .rain-bar-container, .temp-bar-container { position: relative; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; width: 100%; margin: 5px 0; }
        .rain-bar-fill { height: 100%; background: #3498db; border-radius: 3px; }
        .temp-bar-fill { position: absolute; height: 100%; background: linear-gradient(90deg, #5dade2, #f39c12); border-radius: 3px; }
        .temp-dot { position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 50%; top: -2px; box-shadow: 0 0 4px rgba(0,0,0,0.5); z-index: 2; transform: translateX(-50%); }
        .temp-text { text-align: center; color: #b0bec5; font-size: 0.85em; width: 30px;}
        .col-flex { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .label-sm { font-size: 0.65em; color: #b0bec5; margin-bottom: 2px; }

        /* Loading */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f2027;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center; padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <h2 id="loading-text">Menyesuaikan Lokasi...</h2>
    </div>

    <div class="container hidden" id="main-content">
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Cari kota (misal: Jakarta)..." onkeypress="handleSearch(event)">
            <button class="search-btn" onclick="searchCity()"><i class="fas fa-search"></i></button>
            <button class="gps-btn" onclick="initApp()" title="Gunakan GPS"><i class="fas fa-location-crosshairs"></i></button>
        </div>
        
        <!-- Header & Kondisi Saat Ini -->
        <div class="glass-card">
            <div class="header">
                <h1 id="kecamatan-name">Kecamatan</h1>
                <p id="city-name">Kota/Kabupaten</p>
            </div>
            <div class="current-weather">
                <img id="current-icon" class="animated-icon-main" src="" alt="icon">
                <div class="temp-main"><span id="current-temp">--</span>°</div>
                <div class="temp-desc-title" id="current-title">--</div>
                <div class="temp-desc-text" id="current-desc">--</div>
            </div>

            <!-- Grid Ekstra -->
            <div class="details-grid">
                <div class="detail-item">
                    <i class="fas fa-cloud-rain detail-icon"></i>
                    <div class="detail-info"><p>Peluang Hujan</p><h4 id="rain-chance">--%</h4></div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-droplet detail-icon"></i>
                    <div class="detail-info"><p>Kelembapan</p><h4 id="humidity">--%</h4></div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-sun detail-icon" style="color: #f1c40f;"></i>
                    <div class="detail-info"><p>Indeks UV</p><h4 id="uv-index">--</h4></div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-smog detail-icon" style="color: #bdc3c7;"></i>
                    <div class="detail-info"><p>Kualitas Udara</p><h4 id="aqi-value">--</h4></div>
                </div>
            </div>
        </div>

        <!-- Prakiraan 3 Jam dengan Tab -->
        <div class="glass-card">
            <div class="section-title"><i class="far fa-clock"></i> Prakiraan per 3 Jam</div>
            <div class="tabs">
                <button class="tab-btn active" id="tab-0" onclick="renderHourly(0)">Hari Ini</button>
                <button class="tab-btn" id="tab-1" onclick="renderHourly(1)">Besok</button>
                <button class="tab-btn" id="tab-2" onclick="renderHourly(2)">Lusa</button>
            </div>
            <div class="hourly-scroll" id="hourly-container"></div>
        </div>

        <!-- Indikator Suhu & Hujan Harian -->
        <div class="glass-card">
            <div class="section-title"><i class="far fa-calendar-alt"></i> Indikator Suhu & Hujan (3 Hari)</div>
            <div class="daily-list" id="daily-container"></div>
        </div>

    </div>

    <script>
        let globalWeatherData = null; 

        // Mapping Kode WMO menggunakan Animated SVG dari amCharts (Sangat Stabil)
        function getWeatherDetails(code, isDay = true) {
            const baseUrl = "https://www.amcharts.com/wp-content/themes/amcharts4/css/img/icons/weather/animated/";
            
            const map = {
                0: { title: "Cerah", text: "Cuaca cerah sempurna. Tidak ada tanda-tanda hujan.", icon: isDay ? "day.svg" : "night.svg" },
                1: { title: "Cerah Berawan", text: "Langit cerah dengan sedikit awan yang melintas.", icon: isDay ? "cloudy-day-2.svg" : "cloudy-night-2.svg" },
                2: { title: "Berawan", text: "Cukup banyak awan menutupi langit, namun belum ada potensi hujan.", icon: isDay ? "cloudy-day-3.svg" : "cloudy-night-3.svg" },
                3: { title: "Mendung", text: "Langit mendung dan awan tebal. Matahari tertutup penuh.", icon: "cloudy.svg" },
                45: { title: "Berkabut", text: "Jarak pandang terbatas karena kabut. Berhati-hatilah jika berkendara.", icon: "cloudy.svg" },
                48: { title: "Kabut Tebal", text: "Kabut sangat tebal menyelimuti area ini.", icon: "cloudy.svg" },
                51: { title: "Gerimis Ringan", text: "Terjadi gerimis tipis. Bawa payung jika ingin keluar.", icon: "rainy-4.svg" },
                53: { title: "Gerimis", text: "Gerimis mulai turun secara merata.", icon: "rainy-5.svg" },
                55: { title: "Gerimis Lebat", text: "Gerimis lebat yang cukup untuk membuat pakaian basah.", icon: "rainy-6.svg" },
                61: { title: "Hujan Ringan", text: "Hujan intensitas ringan sedang turun. Jangan lupa siapkan jas hujan.", icon: "rainy-4.svg" },
                63: { title: "Hujan Sedang", text: "Hujan turun secara stabil. Lebih baik berteduh jika sedang di luar.", icon: "rainy-5.svg" },
                65: { title: "Hujan Lebat", text: "Terjadi hujan lebat. Waspadai genangan air di jalan.", icon: "rainy-6.svg" },
                80: { title: "Hujan Deras Lokal", text: "Hujan deras turun tiba-tiba dalam waktu singkat.", icon: "rainy-7.svg" },
                95: { title: "Badai Petir", text: "Badai dan petir terdeteksi. Sebaiknya tetap berada di dalam ruangan yang aman.", icon: "thunder.svg" },
                96: { title: "Badai & Hujan Es", text: "Cuaca ekstrem, badai petir disertai potensi hujan es.", icon: "thunder.svg" },
                99: { title: "Badai Hebat", text: "Badai petir parah sedang berlangsung. Sangat tidak disarankan keluar rumah.", icon: "thunder.svg" }
            };

            const data = map[code] || { title: "Berawan", text: "Kondisi cuaca didominasi awan.", icon: "cloudy.svg" };
            
            // Gabungkan URL dasar dengan nama file icon
            data.icon = baseUrl + data.icon;
            return data;
        }

        function showLoading(msg) {
            document.getElementById('loading-text').textContent = msg;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }

        async function getLocationName(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=id`);
                const data = await res.json();
                const addr = data.address;
                document.getElementById('kecamatan-name').textContent = addr.village || addr.suburb || addr.city_district || addr.town || "Lokasi Anda";
                document.getElementById('city-name').textContent = addr.city || addr.county || addr.state || data.name || "Indonesia";
            } catch (error) {
                document.getElementById('kecamatan-name').textContent = "Hasil Pencarian";
                document.getElementById('city-name').textContent = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
            }
        }

        async function getAQI(lat, lon) {
            try {
                const res = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi`);
                const data = await res.json();
                const aqi = data.current.european_aqi;
                let status = "Baik";
                if(aqi > 50) status = "Sedang";
                if(aqi > 100) status = "Buruk";
                if(aqi > 150) status = "Sangat Buruk";
                document.getElementById('aqi-value').textContent = `${aqi} (${status})`;
            } catch(e) { document.getElementById('aqi-value').textContent = "N/A"; }
        }

        async function getWeatherData(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,is_day,weather_code&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max&timezone=auto`;
                const res = await fetch(url);
                globalWeatherData = await res.json();
                
                const cur = globalWeatherData.current;
                const todayDaily = globalWeatherData.daily;
                const weatherInfo = getWeatherDetails(cur.weather_code, cur.is_day === 1);
                
                // Update UI Utama
                document.getElementById('current-temp').textContent = Math.round(cur.temperature_2m);
                document.getElementById('current-title').textContent = weatherInfo.title;
                document.getElementById('current-desc').textContent = weatherInfo.text;
                document.getElementById('current-icon').src = weatherInfo.icon;
                
                // Grid Ekstra
                document.getElementById('humidity').textContent = cur.relative_humidity_2m + "%";
                document.getElementById('uv-index').textContent = todayDaily.uv_index_max[0] || 0;
                
                // Peluang Hujan Saat Ini
                const currentHour = new Date().getHours();
                const hrIndex = globalWeatherData.hourly.time.findIndex(t => new Date(t).getHours() === currentHour);
                const rainChance = hrIndex !== -1 ? globalWeatherData.hourly.precipitation_probability[hrIndex] : 0;
                document.getElementById('rain-chance').textContent = rainChance + "%";

                await getAQI(lat, lon);
                
                renderHourly(0); 
                renderDailyBars(); 

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').innerHTML = "<h2>Gagal memuat cuaca.</h2><button onclick='initApp()' style='margin-top:20px; padding:10px 20px; border-radius:10px;'>Coba Lagi</button>";
            }
        }

        window.renderHourly = function(dayOffset) {
            if(!globalWeatherData) return;
            
            for(let i=0; i<=2; i++) {
                document.getElementById(`tab-${i}`).classList.remove('active');
            }
            document.getElementById(`tab-${dayOffset}`).classList.add('active');

            const container = document.getElementById('hourly-container');
            container.innerHTML = '';

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + dayOffset);
            const targetDayStr = targetDate.toISOString().split('T')[0];

            for (let i = 0; i < globalWeatherData.hourly.time.length; i++) {
                const t = new Date(globalWeatherData.hourly.time[i]);
                const timeDayStr = t.toISOString().split('T')[0];
                
                if (timeDayStr === targetDayStr && t.getHours() % 3 === 0) {
                    const temp = Math.round(globalWeatherData.hourly.temperature_2m[i]);
                    const isDay = globalWeatherData.hourly.is_day[i] === 1;
                    const wInfo = getWeatherDetails(globalWeatherData.hourly.weather_code[i], isDay);
                    const timeLabel = t.getHours().toString().padStart(2, '0') + ':00';

                    container.innerHTML += `
                        <div class="hourly-item">
                            <span class="hourly-time">${timeLabel}</span>
                            <img class="hourly-icon" src="${wInfo.icon}" alt="icon">
                            <span class="hourly-temp">${temp}°</span>
                        </div>
                    `;
                }
            }
        };

        function renderDailyBars() {
            const container = document.getElementById('daily-container');
            container.innerHTML = '';
            
            const daily = globalWeatherData.daily;
            const labels = ["Hari Ini", "Besok", "Lusa"];
            
            let globalMin = Math.min(...daily.temperature_2m_min.slice(0,3));
            let globalMax = Math.max(...daily.temperature_2m_max.slice(0,3));
            let range = globalMax - globalMin;
            if(range === 0) range = 1; 

            const currentTemp = globalWeatherData.current.temperature_2m;

            for (let i = 0; i < 3; i++) {
                const minT = Math.round(daily.temperature_2m_min[i]);
                const maxT = Math.round(daily.temperature_2m_max[i]);
                const rainProb = daily.precipitation_probability_max[i];
                const wInfo = getWeatherDetails(daily.weather_code[i], true);

                const leftPercent = ((minT - globalMin) / range) * 100;
                const widthPercent = ((maxT - minT) / range) * 100;
                
                let dotHtml = '';
                if(i === 0) {
                    let dotPos = ((currentTemp - globalMin) / range) * 100;
                    if(dotPos < 0) dotPos = 0; if(dotPos > 100) dotPos = 100;
                    dotHtml = `<div class="temp-dot" style="left: ${dotPos}%;"></div>`;
                }

                container.innerHTML += `
                    <div class="daily-item">
                        <div class="daily-day">${labels[i]}</div>
                        <img class="daily-icon-img" src="${wInfo.icon}" alt="icon">
                        
                        <div class="col-flex">
                            <span class="label-sm">${rainProb}% ☔</span>
                            <div class="rain-bar-container">
                                <div class="rain-bar-fill" style="width: ${rainProb}%;"></div>
                            </div>
                        </div>

                        <div style="display:flex; align-items:center; width:100%; gap:5px;">
                            <span class="temp-text">${minT}°</span>
                            <div class="temp-bar-container">
                                <div class="temp-bar-fill" style="left: ${leftPercent}%; width: ${widthPercent}%;"></div>
                                ${dotHtml}
                            </div>
                            <span class="temp-text">${maxT}°</span>
                        </div>
                    </div>
                `;
            }
        }

        async function searchCity() {
            const q = document.getElementById('search-input').value;
            if(!q) return;
            showLoading(`Mencari ${q}...`);
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&accept-language=id`);
                const data = await res.json();
                if(data.length > 0) {
                    document.getElementById('kecamatan-name').textContent = data[0].name || q;
                    document.getElementById('city-name').textContent = (data[0].display_name.split(',')[1] || "").trim();
                    getWeatherData(parseFloat(data[0].lat), parseFloat(data[0].lon));
                } else {
                    alert("Kota tidak ditemukan.");
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('main-content').classList.remove('hidden');
                }
            } catch(e) { alert("Error saat mencari kota."); }
        }

        function handleSearch(e) { if(e.key === 'Enter') searchCity(); }

        function initApp() {
            showLoading("Mencari Lokasi GPS...");
            document.getElementById('search-input').value = "";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        getLocationName(pos.coords.latitude, pos.coords.longitude);
                        getWeatherData(pos.coords.latitude, pos.coords.longitude);
                    },
                    () => {
                        alert("Akses GPS gagal. Menampilkan Jakarta.");
                        getLocationName(-6.2088, 106.8456);
                        getWeatherData(-6.2088, 106.8456);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                getLocationName(-6.2088, 106.8456);
                getWeatherData(-6.2088, 106.8456);
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
