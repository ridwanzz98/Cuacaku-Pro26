<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca Premium ID Ultimate</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS untuk Peta Radar -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff; min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 20px;
        }
        .container { width: 100%; max-width: 600px; padding-bottom: 40px; }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Search Bar */
        .search-container {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .search-input {
            flex: 1; padding: 12px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: #fff;
            font-family: 'Poppins', sans-serif; outline: none;
        }
        .search-input::placeholder { color: #b0bec5; }
        .search-btn, .gps-btn {
            background: rgba(255,255,255,0.2); border: none;
            color: #fff; padding: 12px 18px; border-radius: 20px;
            cursor: pointer; transition: 0.3s;
        }
        .search-btn:hover, .gps-btn:hover { background: rgba(255,255,255,0.4); }

        /* Header / Lokasi */
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { font-size: 1.8em; font-weight: 600; margin-bottom: 5px; }
        .header p { font-size: 0.9em; color: #b0bec5; }

        /* Suhu Saat Ini */
        .current-weather { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .temp-main { font-size: 5em; font-weight: 700; line-height: 1; margin: 15px 0; text-shadow: 2px 4px 10px rgba(0,0,0,0.3); }
        .temp-desc { font-size: 1.2em; text-transform: capitalize; margin-bottom: 10px; }
        .temp-minmax { font-size: 0.9em; color: #cfd8dc; }

        /* Grid Detail (Kelembapan, UV, dll) */
        .details-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .detail-item {
            display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.2); padding: 12px; border-radius: 16px;
        }
        .detail-icon { font-size: 1.5em; color: #90caf9; }
        .detail-info p { font-size: 0.75em; color: #b0bec5; margin-bottom: 2px; }
        .detail-info h4 { font-size: 1em; font-weight: 600; }

        /* Peta Radar */
        .radar-container { padding: 15px; }
        .section-title { font-size: 1.1em; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        #map { height: 250px; border-radius: 16px; width: 100%; background: #1a1a1a; z-index: 1; }

        /* Prakiraan 3 Jam (Horizontal Scroll) */
        .hourly-scroll {
            display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.3) transparent;
        }
        .hourly-item { display: flex; flex-direction: column; align-items: center; min-width: 70px; gap: 8px; }
        .hourly-time { font-size: 0.85em; color: #b0bec5; }
        .hourly-icon { font-size: 1.5em; }
        .hourly-temp { font-weight: 600; }

        /* Prakiraan 3 Hari */
        .daily-list { display: flex; flex-direction: column; gap: 15px; }
        .daily-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .daily-item:last-child { border-bottom: none; padding-bottom: 0; }
        .daily-day { flex: 1; font-weight: 600; }
        .daily-icon { flex: 1; text-align: center; font-size: 1.2em; }
        .daily-temps { flex: 1; text-align: right; font-size: 0.9em; }
        .daily-temps span { display: inline-block; width: 35px; }
        .temp-low { color: #90caf9; }

        /* Loading */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f2027;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center; padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <h2 id="loading-text">Menyesuaikan Lokasi...</h2>
    </div>

    <div class="container hidden" id="main-content">
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Cari kota (misal: Jakarta, Bali)..." onkeypress="handleSearch(event)">
            <button class="search-btn" onclick="searchCity()"><i class="fas fa-search"></i></button>
            <button class="gps-btn" onclick="initApp()" title="Gunakan GPS"><i class="fas fa-location-crosshairs"></i></button>
        </div>
        
        <!-- Header & Suhu Saat Ini -->
        <div class="glass-card">
            <div class="header">
                <h1 id="kecamatan-name">Kecamatan</h1>
                <p id="city-name">Kota/Kabupaten</p>
            </div>
            <div class="current-weather">
                <div class="temp-main"><span id="current-temp">--</span>°</div>
                <div class="temp-desc" id="current-desc"><i class="fas fa-cloud"></i> Memuat...</div>
                <div class="temp-minmax">Terasa seperti <span id="feels-like">--</span>° | H: <span id="today-high">--</span>° L: <span id="today-low">--</span>°</div>
            </div>

            <!-- Grid Ekstra (Baru) -->
            <div class="details-grid">
                <div class="detail-item">
                    <i class="fas fa-droplet detail-icon"></i>
                    <div class="detail-info"><p>Kelembapan</p><h4 id="humidity">--%</h4></div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-sun detail-icon" style="color: #f1c40f;"></i>
                    <div class="detail-info"><p>Indeks UV</p><h4 id="uv-index">--</h4></div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-smog detail-icon" style="color: #bdc3c7;"></i>
                    <div class="detail-info"><p>Kualitas Udara (AQI)</p><h4 id="aqi-value">--</h4></div>
                </div>
                <div class="detail-item">
                    <i class="fas fa-cloud-sun detail-icon" style="color: #e67e22;"></i>
                    <div class="detail-info"><p>Matahari</p><h4 id="sun-time">--:--</h4></div>
                </div>
            </div>
        </div>

        <!-- Prakiraan Per 3 Jam -->
        <div class="glass-card">
            <div class="section-title"><i class="far fa-clock"></i> Prakiraan per 3 Jam</div>
            <div class="hourly-scroll" id="hourly-container"></div>
        </div>

        <!-- Peta Radar Hujan -->
        <div class="glass-card radar-container">
            <div class="section-title"><i class="fas fa-satellite-dish"></i> Peta Radar Hujan</div>
            <div id="map"></div>
        </div>

        <!-- Prakiraan 3 Hari -->
        <div class="glass-card">
            <div class="section-title"><i class="far fa-calendar-alt"></i> Prakiraan 3 Hari</div>
            <div class="daily-list" id="daily-container"></div>
        </div>

    </div>

    <!-- Script Leaflet (Peta) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        function getWeatherDetails(code) {
            const map = {
                0: { desc: "Cerah", icon: "fas fa-sun", color: "#f1c40f" },
                1: { desc: "Cerah Berawan", icon: "fas fa-cloud-sun", color: "#f39c12" },
                2: { desc: "Berawan", icon: "fas fa-cloud", color: "#bdc3c7" },
                3: { desc: "Mendung", icon: "fas fa-cloud", color: "#95a5a6" },
                45: { desc: "Berkabut", icon: "fas fa-smog", color: "#ecf0f1" },
                48: { desc: "Kabut Tebal", icon: "fas fa-smog", color: "#bdc3c7" },
                51: { desc: "Gerimis Ringan", icon: "fas fa-cloud-rain", color: "#3498db" },
                53: { desc: "Gerimis", icon: "fas fa-cloud-rain", color: "#2980b9" },
                55: { desc: "Gerimis Lebat", icon: "fas fa-cloud-showers-heavy", color: "#2980b9" },
                61: { desc: "Hujan Ringan", icon: "fas fa-cloud-rain", color: "#3498db" },
                63: { desc: "Hujan Sedang", icon: "fas fa-cloud-showers-water", color: "#2980b9" },
                65: { desc: "Hujan Lebat", icon: "fas fa-cloud-showers-heavy", color: "#2c3e50" },
                80: { desc: "Hujan Deras Lokal", icon: "fas fa-cloud-showers-heavy", color: "#2c3e50" },
                95: { desc: "Badai Petir", icon: "fas fa-bolt", color: "#8e44ad" },
                96: { desc: "Badai & Hujan", icon: "fas fa-poo-storm", color: "#2c3e50" },
                99: { desc: "Badai Hebat", icon: "fas fa-poo-storm", color: "#2c3e50" }
            };
            return map[code] || { desc: "Tidak Diketahui", icon: "fas fa-question", color: "#fff" };
        }

        function formatTimeOnly(dateString) {
            const date = new Date(dateString);
            return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
        }

        function showLoading(msg) {
            document.getElementById('loading-text').textContent = msg;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }

        async function getLocationName(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=id`);
                const data = await response.json();
                const addr = data.address;
                document.getElementById('kecamatan-name').textContent = addr.village || addr.suburb || addr.city_district || addr.town || "Lokasi Anda";
                document.getElementById('city-name').textContent = addr.city || addr.county || addr.state || data.name || "Indonesia";
            } catch (error) {
                document.getElementById('kecamatan-name').textContent = "Hasil Pencarian";
                document.getElementById('city-name').textContent = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
            }
        }

        async function getAQI(lat, lon) {
            try {
                const response = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi`);
                const data = await response.json();
                const aqi = data.current.european_aqi;
                let status = "Baik";
                if(aqi > 50) status = "Sedang";
                if(aqi > 100) status = "Buruk";
                if(aqi > 150) status = "Sangat Buruk";
                document.getElementById('aqi-value').textContent = `${aqi} (${status})`;
            } catch(e) {
                document.getElementById('aqi-value').textContent = "N/A";
            }
        }

        async function getWeatherData(lat, lon) {
            try {
                // Fetch Cuaca Utama
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto`;
                const response = await fetch(url);
                const data = await response.json();

                // UI Cuaca Saat Ini
                const current = data.current;
                const todayDaily = data.daily;
                const weatherInfo = getWeatherDetails(current.weather_code);
                
                document.getElementById('current-temp').textContent = Math.round(current.temperature_2m);
                document.getElementById('feels-like').textContent = Math.round(current.apparent_temperature);
                document.getElementById('current-desc').innerHTML = `<i class="${weatherInfo.icon}" style="color:${weatherInfo.color}"></i> ${weatherInfo.desc}`;
                document.getElementById('today-high').textContent = Math.round(todayDaily.temperature_2m_max[0]);
                document.getElementById('today-low').textContent = Math.round(todayDaily.temperature_2m_min[0]);
                
                // UI Detail Ekstra
                document.getElementById('humidity').textContent = current.relative_humidity_2m + "%";
                document.getElementById('uv-index').textContent = todayDaily.uv_index_max[0];
                document.getElementById('sun-time').textContent = formatTimeOnly(todayDaily.sunrise[0]) + " / " + formatTimeOnly(todayDaily.sunset[0]);

                // UI Prakiraan 3 Jam
                const hourlyContainer = document.getElementById('hourly-container');
                hourlyContainer.innerHTML = '';
                const currentHour = new Date().getHours();
                let startIndex = data.hourly.time.findIndex(t => new Date(t).getHours() === currentHour);
                if(startIndex === -1) startIndex = 0;

                for (let i = startIndex; i < startIndex + 24; i += 3) {
                    if(!data.hourly.time[i]) break;
                    const wDetail = getWeatherDetails(data.hourly.weather_code[i]);
                    const item = document.createElement('div');
                    item.className = 'hourly-item';
                    item.innerHTML = `
                        <span class="hourly-time">${i === startIndex ? 'Sekrg' : new Date(data.hourly.time[i]).getHours()+':00'}</span>
                        <i class="${wDetail.icon} hourly-icon" style="color:${wDetail.color}"></i>
                        <span class="hourly-temp">${Math.round(data.hourly.temperature_2m[i])}°</span>
                    `;
                    hourlyContainer.appendChild(item);
                }

                // UI Prakiraan 3 Hari
                const dailyContainer = document.getElementById('daily-container');
                dailyContainer.innerHTML = '';
                const dayLabels = ["Hari ini", "Besok", "Lusa"];
                for (let i = 0; i < 3; i++) {
                    const wDetail = getWeatherDetails(data.daily.weather_code[i]);
                    const item = document.createElement('div');
                    item.className = 'daily-item';
                    item.innerHTML = `
                        <div class="daily-day">${dayLabels[i]}</div>
                        <div class="daily-icon"><i class="${wDetail.icon}" style="color:${wDetail.color}"></i></div>
                        <div class="daily-temps"><span class="temp-low">${Math.round(data.daily.temperature_2m_min[i])}°</span> <span>${Math.round(data.daily.temperature_2m_max[i])}°</span></div>
                    `;
                    dailyContainer.appendChild(item);
                }

                // Fetch Kualitas Udara (AQI)
                await getAQI(lat, lon);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                initRadarMap(lat, lon);

            } catch (error) {
                document.getElementById('loading').innerHTML = "<h2>Gagal memuat data cuaca.</h2><button onclick='initApp()' style='margin-top:20px; padding:10px 20px; border-radius:10px; border:none; cursor:pointer;'>Coba Lagi</button>";
            }
        }

        async function initRadarMap(lat, lon) {
            // Hapus map lama jika sudah ada (berguna saat cari kota baru)
            if (window.mapInstance) {
                window.mapInstance.remove();
            }
            
            const map = L.map('map', { zoomControl: false }).setView([lat, lon], 10);
            window.mapInstance = map;

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            L.marker([lat, lon]).addTo(map);

            try {
                const rvResponse = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const rvData = await rvResponse.json();
                const latestTimestamp = rvData.radar.past[rvData.radar.past.length - 1].time;

                L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${latestTimestamp}/256/{z}/{x}/{y}/2/1_1.png`, {
                    opacity: 0.65, zIndex: 10
                }).addTo(map);
            } catch(e) { console.log("Gagal muat radar"); }
        }

        // --- Fitur Pencarian Kota ---
        async function searchCity() {
            const query = document.getElementById('search-input').value;
            if(!query) return;
            
            showLoading(`Mencari ${query}...`);
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?q=${query}&format=json&limit=1&accept-language=id`);
                const data = await response.json();
                
                if(data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    
                    document.getElementById('kecamatan-name').textContent = data[0].name || query;
                    document.getElementById('city-name').textContent = data[0].display_name.split(',')[1] || "Hasil Pencarian";
                    
                    getWeatherData(lat, lon);
                } else {
                    alert("Kota tidak ditemukan. Coba nama yang lebih spesifik.");
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('main-content').classList.remove('hidden');
                }
            } catch(e) {
                alert("Terjadi kesalahan saat mencari kota.");
            }
        }

        function handleSearch(e) {
            if(e.key === 'Enter') searchCity();
        }

        function initApp() {
            showLoading("Mencari Lokasi GPS...");
            document.getElementById('search-input').value = ""; // Bersihkan kolom pencarian
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        getLocationName(lat, lon);
                        getWeatherData(lat, lon);
                    },
                    (error) => {
                        // Jika GPS ditolak, default ke Jakarta
                        alert("Akses GPS ditolak/gagal. Menampilkan cuaca Jakarta sebagai default.");
                        getLocationName(-6.2088, 106.8456);
                        getWeatherData(-6.2088, 106.8456);
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
